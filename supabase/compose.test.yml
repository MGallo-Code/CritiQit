# Compose overlay for pgTAP database testing
# Usage: docker compose -f compose.yml -f compose.test.yml run --rm test-runner
#
# This overlay extends compose.yml with testing-specific configuration.
# Tests run in transactions and ROLLBACK, leaving the database unchanged.
#
# First-time setup (builds the test runner image):
#   docker compose -f compose.yml -f compose.test.yml build test-runner

services:
  # Extend database service with test file mounts
  db:
    volumes:
      - ./tests:/tests:ro

  # Test runner service with pg_prove pre-installed
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: supabase_admin
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
    volumes:
      - ./tests:/tests:ro
    working_dir: /tests
    entrypoint: []
    command: >
      sh -c "
        echo '📦 Waiting for database to be ready...' &&
        until pg_isready -h db -U supabase_admin -d postgres; do sleep 1; done &&
        echo '🔧 Installing pgTAP extension...' &&
        psql -h db -U supabase_admin -d postgres -c 'CREATE EXTENSION IF NOT EXISTS pgtap;' &&
        echo '📊 Loading test fixtures...' &&
        psql -h db -U supabase_admin -d postgres -f /tests/fixtures/test-users.sql &&
        echo '🧪 Running pgTAP tests...' &&
        pg_prove -h db -U supabase_admin -d postgres --verbose /tests/rls/*.test.sql /tests/functions/*.test.sql &&
        echo '✅ All tests completed!'
      "
    profiles:
      - test

networks:
  default:
    name: supabase_network_critiqit

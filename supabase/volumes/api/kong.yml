_format_version: '3.0'
_transform: true

###
### Global Plugins (DISABLED - using per-route plugins instead)
###
# Commented out - now using per-route rate limiting configuration
# plugins:
#   - name: rate-limit-db
#     enabled: false

###
### Consumers / Users
###
consumers:
  - username: DASHBOARD
  - username: anon
    keyauth_credentials:
      - key: $SUPABASE_ANON_KEY
  - username: service_role
    keyauth_credentials:
      - key: $SUPABASE_SERVICE_KEY

###
### Access Control List
###
acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin

###
### Dashboard credentials
###
basicauth_credentials:
  - consumer: DASHBOARD
    username: $DASHBOARD_USERNAME
    password: $DASHBOARD_PASSWORD

###
### API Routes with Three-Tier Rate Limiting
###
### ARCHITECTURE:
### - Tier 1 (IP):      Baseline protection for anonymous/OAuth endpoints
### - Tier 2 (Content): Email-based protection + IP fallback (signup/login)
### - Tier 3 (User):    JWT sub claim protection for authenticated endpoints
###
### SECURITY MODEL:
### - Composite checks run sequentially (fail-fast)
### - If ANY check fails, request is blocked with 429
### - Service role (internal services) bypass all rate limiting
### - Database-backed for distributed rate limiting across Kong workers
###
### FAIL-OPEN POLICY:
### - If database connection fails, requests are ALLOWED
### - Prevents outage if PostgreSQL becomes unavailable
### - Logs errors for monitoring/alerting
###
services:
  #########################################
  ## Tier 2: Content-Based Auth Routes
  ##
  ## PURPOSE: Prevent account-based abuse where attackers
  ## use multiple IPs to target specific victim emails.
  ##
  ## SECURITY: Dual protection layer
  ## - Email check: Protects individual users from spam
  ## - IP check: Prevents distributed attacks across IPs
  ##
  ## CLIENT HEADERS: Exposed to help legitimate clients
  ## implement backoff strategies (X-RateLimit-*)
  #########################################

  - name: auth-v1-signup
    _comment: 'Signup: 10/email/hr prevents account spam, 50/IP/hr prevents distributed abuse'
    url: http://auth:9999/signup
    routes:
      - name: auth-v1-signup
        strip_path: true
        paths:
          - /auth/v1/signup
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon
      - name: rate-limit-db
        config:
          checks:
            # Check 1: Email-based (protects individual users)
            # - Max 10 signups per email per hour (prevents spam attacks)
            # - Max 20 signups per email per day (allows legitimate retries)
            - type: content
              fields: ["email"]
              limits:
                hour: 10
                day: 20
            # Check 2: IP-based (prevents distributed attacks)
            # - Max 50 signups per IP per hour (allows shared networks)
            # - Max 500 signups per IP per day (enterprise/proxy tolerance)
            - type: ip
              limits:
                hour: 50
                day: 500
          db_host: db
          db_port: 5432
          db_name: postgres
          db_user: supabase_admin
          db_password: $POSTGRES_PASSWORD
          service_role_key: $SUPABASE_SERVICE_KEY
          hide_client_headers: false

  - name: auth-v1-token
    _comment: 'Login: 10/email/hr prevents brute force, 50/IP/hr prevents credential stuffing'
    url: http://auth:9999/token
    routes:
      - name: auth-v1-token
        strip_path: true
        paths:
          - /auth/v1/token
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon
      - name: rate-limit-db
        config:
          checks:
            # Check 1: Email-based (prevents password brute force)
            # - Max 10 login attempts per email per hour
            # - Max 100 login attempts per email per day (legitimate users with typos)
            - type: content
              fields: ["email"]
              limits:
                hour: 10
                day: 100
            # Check 2: IP-based (prevents credential stuffing attacks)
            # - Max 50 login attempts per IP per hour
            # - Max 500 login attempts per IP per day
            - type: ip
              limits:
                hour: 50
                day: 500
          db_host: db
          db_port: 5432
          db_name: postgres
          db_user: supabase_admin
          db_password: $POSTGRES_PASSWORD
          service_role_key: $SUPABASE_SERVICE_KEY
          hide_client_headers: false

  - name: auth-v1-recover
    _comment: 'Password reset: 3/email/hr prevents email spam, 30/IP/hr prevents enumeration'
    url: http://auth:9999/recover
    routes:
      - name: auth-v1-recover
        strip_path: true
        paths:
          - /auth/v1/recover
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon
      - name: rate-limit-db
        config:
          checks:
            # Check 1: Email-based (prevents password reset email spam)
            # - Max 1 reset per email per minute (prevents email spam)
            # - Max 3 resets per email per hour (tight limit - legitimate users need few)
            # - Max 30 resets per email per day (allows for forgotten attempts)
            - type: content
              fields: ["email"]
              limits:
                minute: 1
                hour: 3
                day: 30
            # Check 2: IP-based (prevents account enumeration attacks)
            # - Max 1 reset per IP per minute (prevents account enumeration attacks)
            # - Max 30 resets per IP per hour (allows some probing but not mass enumeration)
            # - Max 300 resets per IP per day
            - type: ip
              limits:
                minute: 1
                hour: 30
                day: 300
          db_host: db
          db_port: 5432
          db_name: postgres
          db_user: supabase_admin
          db_password: $POSTGRES_PASSWORD
          service_role_key: $SUPABASE_SERVICE_KEY
          hide_client_headers: false

  - name: auth-v1-resend
    _comment: 'Resend verification: 3/email/hr prevents email spam, 30/IP/hr prevents abuse'
    url: http://auth:9999/resend
    routes:
      - name: auth-v1-resend
        strip_path: true
        paths:
          - /auth/v1/resend
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon
      - name: rate-limit-db
        config:
          checks:
            # Check 1: Email-based (prevents verification email spam)
            # - Max 1 resend per email per minute (prevents email spam)
            # - Max 3 resends per email per hour (tight - legitimate users need few)
            # - Max 30 resends per email per day (allows for lost emails)
            - type: content
              fields: ["email"]
              limits:
                minute: 1
                hour: 3
                day: 30
            # Check 2: IP-based (prevents distributed resend abuse)
            # - Max 1 resend per IP per minute (prevents distributed resend abuse)
            # - Max 30 resends per IP per hour
            # - Max 300 resends per IP per day
            - type: ip
              limits:
                minute: 1
                hour: 30
                day: 300
          db_host: db
          db_port: 5432
          db_name: postgres
          db_user: supabase_admin
          db_password: $POSTGRES_PASSWORD
          service_role_key: $SUPABASE_SERVICE_KEY
          hide_client_headers: false

  #########################################
  ## Tier 1: IP-Based Auth Routes (OAuth)
  ##
  ## PURPOSE: OAuth callbacks don't contain stable identifiers
  ## (no email in body, JWT not yet issued), so we use IP-only.
  ##
  ## SECURITY: High limits (100/min, 1000/hr) because OAuth
  ## redirects can spike during legitimate flows.
  ##
  ## RATIONALE: OAuth providers rate limit on their end,
  ## so we only need to prevent extreme abuse here.
  #########################################

  - name: auth-v1-callback
    _comment: 'OAuth callback: 100/IP/min allows burst traffic, 1000/IP/hr prevents abuse'
    url: http://auth:9999/callback
    routes:
      - name: auth-v1-callback
        strip_path: true
        paths:
          - /auth/v1/callback
    plugins:
      - name: cors
      - name: rate-limit-db
        config:
          checks:
            # IP-based only (OAuth callbacks don't have email or JWT yet)
            # - Max 100 requests per IP per minute (handles OAuth redirect bursts)
            # - Max 1000 requests per IP per hour (prevents abuse)
            - type: ip
              limits:
                minute: 100
                hour: 1000
          db_host: db
          db_port: 5432
          db_name: postgres
          db_user: supabase_admin
          db_password: $POSTGRES_PASSWORD
          service_role_key: $SUPABASE_SERVICE_KEY
          hide_client_headers: false

  - name: auth-v1-authorize
    _comment: 'OAuth authorize: 100/IP/min allows burst traffic, 1000/IP/hr prevents abuse'
    url: http://auth:9999/authorize
    routes:
      - name: auth-v1-authorize
        strip_path: true
        paths:
          - /auth/v1/authorize
    plugins:
      - name: cors
      - name: rate-limit-db
        config:
          checks:
            # IP-based only (OAuth authorization redirects don't have email or JWT yet)
            # - Max 100 requests per IP per minute (handles OAuth redirect bursts)
            # - Max 1000 requests per IP per hour (prevents abuse)
            - type: ip
              limits:
                minute: 100
                hour: 1000
          db_host: db
          db_port: 5432
          db_name: postgres
          db_user: supabase_admin
          db_password: $POSTGRES_PASSWORD
          service_role_key: $SUPABASE_SERVICE_KEY
          hide_client_headers: false

  #########################################
  ## Tier 3: User-Based Auth Routes
  ##
  ## PURPOSE: Authenticated endpoints with valid JWT tokens
  ## rate limit by user ID (JWT sub claim).
  ##
  ## SECURITY: Prevents abuse by authenticated users
  ## who might automate actions or spam endpoints.
  ##
  ## RATIONALE: User-based limits are fair (per-user quotas)
  ## and prevent users from circumventing IP-based limits
  ## by rotating IPs (VPNs, mobile networks).
  #########################################

  - name: auth-v1-verify
    _comment: 'Email verification: 5/user/min, 20/user/hr, 50/user/day prevents brute force on OTPs'
    url: http://auth:9999/verify
    routes:
      - name: auth-v1-verify
        strip_path: true
        paths:
          - /auth/v1/verify
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          deny:
            - anon
      - name: rate-limit-db
        config:
          checks:
            # Check 1: User-based (prevents single user from spamming)
            # - Max 5 verifications per user per minute (allows typo retries)
            # - Max 20 verifications per user per hour (prevents sustained brute force)
            # - Max 50 verifications per user per day (allows multiple verification sessions)
            - type: user
              limits:
                minute: 5
                hour: 20
                day: 50
            # Check 2: IP-based fallback (prevents distributed attacks)
            # - Max 10 verifications per IP per minute (allows multiple users on same IP)
            # - Max 50 verifications per IP per hour (prevents automation from single source)
            - type: ip
              limits:
                minute: 10
                hour: 50
          db_host: db
          db_port: 5432
          db_name: postgres
          db_user: supabase_admin
          db_password: $POSTGRES_PASSWORD
          service_role_key: $SUPABASE_SERVICE_KEY
          hide_client_headers: false

  - name: auth-v1-user
    _comment: 'User operations: 100/user/min allows profile updates, 1000/user/hr prevents spam'
    url: http://auth:9999/user
    routes:
      - name: auth-v1-user
        strip_path: true
        paths:
          - /auth/v1/user
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon
      - name: rate-limit-db
        config:
          checks:
            # User-based (JWT sub claim from Authorization header)
            # - Max 100 operations per user per minute (GET/PATCH user profile)
            # - Max 1000 operations per user per hour (prevents automated abuse)
            - type: user
              limits:
                minute: 100
                hour: 1000
          db_host: db
          db_port: 5432
          db_name: postgres
          db_user: supabase_admin
          db_password: $POSTGRES_PASSWORD
          service_role_key: $SUPABASE_SERVICE_KEY
          hide_client_headers: false

  - name: auth-v1-logout
    _comment: 'Logout: 10/user/min allows normal usage, 100/user/hr prevents automated spam'
    url: http://auth:9999/logout
    routes:
      - name: auth-v1-logout
        strip_path: true
        paths:
          - /auth/v1/logout
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon
      - name: rate-limit-db
        config:
          checks:
            # User-based (JWT sub claim from Authorization header)
            # - Max 10 logouts per user per minute (normally just 1, but allows retries)
            # - Max 100 logouts per user per hour (prevents automated logout spam)
            - type: user
              limits:
                minute: 10
                hour: 100
          db_host: db
          db_port: 5432
          db_name: postgres
          db_user: supabase_admin
          db_password: $POSTGRES_PASSWORD
          service_role_key: $SUPABASE_SERVICE_KEY
          hide_client_headers: false

  #########################################
  ## Auth Catch-All (for remaining endpoints)
  ##
  ## PURPOSE: Fallback route for any /auth/v1/* endpoints
  ## not explicitly configured above.
  ##
  ## SECURITY: Composite user + IP checks with fallback
  ## - Try user-based first (if JWT present)
  ## - Fall back to IP-based (if no JWT or extraction fails)
  ##
  ## RATIONALE: Provides baseline protection for endpoints
  ## we haven't explicitly configured (future endpoints, misc routes).
  #########################################

  - name: auth-v1-remaining
    _comment: 'Auth catch-all: 60/user/min + 100/IP/min fallback for unconfigured endpoints'
    url: http://auth:9999/
    routes:
      - name: auth-v1-remaining
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon
      - name: rate-limit-db
        config:
          checks:
            # Check 1: User-based (JWT sub claim - if present)
            # - Max 60 requests per user per minute
            # - Max 1000 requests per user per hour
            - type: user
              limits:
                minute: 60
                hour: 1000
            # Check 2: IP-based fallback (if no JWT or extraction fails)
            # - Max 100 requests per IP per minute
            - type: ip
              limits:
                minute: 100
          db_host: db
          db_port: 5432
          db_name: postgres
          db_user: supabase_admin
          db_password: $POSTGRES_PASSWORD
          service_role_key: $SUPABASE_SERVICE_KEY
          hide_client_headers: false

  #########################################
  ## Edge Functions Routes
  ##
  ## PURPOSE: Custom edge functions (serverless).
  ##
  ## SECURITY: OTP verification uses email + IP (like signup/login)
  ## to prevent both targeted attacks and distributed abuse.
  ## Generic functions get IP-only baseline protection.
  #########################################

  - name: functions-v1-verify-otp
    _comment: 'OTP verification: 10/email/hr prevents spam, 50/IP/hr prevents distributed attacks'
    url: http://functions:9000/verify-otp-securely
    routes:
      - name: functions-v1-verify-otp
        strip_path: true
        paths:
          - /functions/v1/verify-otp-securely
    plugins:
      - name: cors
      - name: rate-limit-db
        config:
          checks:
            # Check 1: Email-based (prevents OTP spam to specific users)
            # - Max 10 OTP verifications per email per hour
            # - Max 100 OTP verifications per email per day
            - type: content
              fields: ["email"]
              limits:
                hour: 10
                day: 100
            # Check 2: IP-based (prevents distributed OTP brute force)
            # - Max 50 OTP verifications per IP per hour
            # - Max 500 OTP verifications per IP per day
            - type: ip
              limits:
                hour: 50
                day: 500
          db_host: db
          db_port: 5432
          db_name: postgres
          db_user: supabase_admin
          db_password: $POSTGRES_PASSWORD
          service_role_key: $SUPABASE_SERVICE_KEY
          hide_client_headers: false

  - name: functions-v1
    _comment: 'Functions catch-all: 100/IP/min baseline protection for all edge functions'
    url: http://functions:9000/
    routes:
      - name: functions-v1-all
        strip_path: true
        paths:
          - /functions/v1/
    plugins:
      - name: cors
      - name: rate-limit-db
        config:
          checks:
            # IP-based only (edge functions vary widely in auth requirements)
            # - Max 100 requests per IP per minute
            # - Max 1000 requests per IP per hour
            # - Max 10000 requests per IP per day (generous for legitimate usage)
            - type: ip
              limits:
                minute: 100
                hour: 1000
                day: 10000
          db_host: db
          db_port: 5432
          db_name: postgres
          db_user: supabase_admin
          db_password: $POSTGRES_PASSWORD
          service_role_key: $SUPABASE_SERVICE_KEY
          hide_client_headers: false

  #########################################
  ## REST API Routes
  ##
  ## PURPOSE: PostgREST (auto-generated REST API from PostgreSQL schema).
  ##
  ## SECURITY: Composite user + IP with fallback
  ## - Authenticated requests: 100/user/min, 5000/user/hr (generous for data apps)
  ## - Unauthenticated/fallback: 100/IP/min
  ##
  ## RATIONALE: High limits because legitimate apps make many data queries.
  ## RLS policies provide the real security layer; rate limiting prevents abuse.
  #########################################

  - name: rest-v1
    _comment: 'PostgREST: 100/user/min + 5000/user/hr for authenticated, 100/IP/min fallback'
    url: http://rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: true
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon
      - name: rate-limit-db
        config:
          checks:
            # Check 1: User-based (JWT sub claim - if present)
            # - Max 100 requests per user per minute (generous for data-heavy apps)
            # - Max 5000 requests per user per hour (supports pagination, real-time polling)
            - type: user
              limits:
                minute: 100
                hour: 5000
            # Check 2: IP-based fallback (if no JWT or extraction fails)
            # - Max 100 requests per IP per minute
            - type: ip
              limits:
                minute: 100
          db_host: db
          db_port: 5432
          db_name: postgres
          db_user: supabase_admin
          db_password: $POSTGRES_PASSWORD
          service_role_key: $SUPABASE_SERVICE_KEY
          hide_client_headers: false

  #########################################
  ## GraphQL Routes
  ##
  ## PURPOSE: GraphQL API via PostgREST RPC function.
  ##
  ## SECURITY: Composite user + IP with fallback (like REST API)
  ## - Authenticated requests: 60/user/min, 1000/user/hr
  ## - Unauthenticated/fallback: 100/IP/min, 1000/IP/hr
  ##
  ## RATIONALE: Lower than REST API limits because GraphQL queries
  ## can be more expensive (complex joins, nested resolvers).
  #########################################

  - name: graphql-v1
    _comment: 'GraphQL: 60/user/min + 1000/user/hr for authenticated, 100/IP/min fallback'
    url: http://rest:3000/rpc/graphql
    routes:
      - name: graphql-v1-all
        strip_path: true
        paths:
          - /graphql/v1
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: true
      - name: request-transformer
        config:
          add:
            headers:
              - Content-Profile:graphql_public
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon
      - name: rate-limit-db
        config:
          checks:
            # Check 1: User-based (JWT sub claim - if present)
            # - Max 60 requests per user per minute (lower than REST - GraphQL is expensive)
            # - Max 1000 requests per user per hour
            - type: user
              limits:
                minute: 60
                hour: 1000
            # Check 2: IP-based fallback (if no JWT or extraction fails)
            # - Max 100 requests per IP per minute
            # - Max 1000 requests per IP per hour
            - type: ip
              limits:
                minute: 100
                hour: 1000
          db_host: db
          db_port: 5432
          db_name: postgres
          db_user: supabase_admin
          db_password: $POSTGRES_PASSWORD
          service_role_key: $SUPABASE_SERVICE_KEY
          hide_client_headers: false

  #########################################
  ## Storage Routes
  ##
  ## PURPOSE: File upload/download via Supabase Storage.
  ##
  ## SECURITY:
  ## - Public downloads: IP-only (no auth required, high limits for CDN-like usage)
  ## - Authenticated operations: User + IP fallback (uploads, deletes, metadata)
  ##
  ## RATIONALE: Public downloads need high limits (200/min, 5000/hr)
  ## for legitimate file serving. Authenticated operations are tighter
  ## (20/user/min, 500/user/hr) to prevent storage abuse.
  #########################################

  - name: storage-v1-public
    _comment: 'Public storage: 200/IP/min + 5000/IP/hr allows CDN-like file serving'
    url: http://storage:5000/
    routes:
      - name: storage-v1-public
        strip_path: true
        paths:
          - /storage/v1/
        methods:
          - GET
    plugins:
      - name: cors
      - name: rate-limit-db
        config:
          checks:
            # IP-based only (public downloads don't require auth)
            # - Max 200 requests per IP per minute (high - supports file galleries, image loading)
            # - Max 5000 requests per IP per hour (CDN-like usage patterns)
            - type: ip
              limits:
                minute: 200
                hour: 5000
          db_host: db
          db_port: 5432
          db_name: postgres
          db_user: supabase_admin
          db_password: $POSTGRES_PASSWORD
          service_role_key: $SUPABASE_SERVICE_KEY
          hide_client_headers: false

  - name: storage-v1-avatar-upload
    _comment: 'Avatar uploads: 5/user/hr + 20/user/day prevents abuse, allows legitimate updates'
    url: http://storage:5000/object/avatars/
    routes:
      - name: storage-v1-avatar-upload
        strip_path: true
        paths:
          - ~/storage/v1/object/avatars/
        methods:
          - POST
          - PUT
          - PATCH
          - DELETE
    plugins:
      - name: cors
      - name: rate-limit-db
        config:
          checks:
            # Check 1: User-based (JWT sub claim)
            # - Max 5 avatar uploads per user per hour (prevents profile pic spam)
            # - Max 20 avatar uploads per user per day (allows legitimate changes)
            - type: user
              limits:
                hour: 5
                day: 20
            # Check 2: IP-based fallback (if JWT missing or extraction fails)
            # - Max 10 avatar uploads per IP per hour (prevents distributed attacks)
            - type: ip
              limits:
                hour: 10
          db_host: db
          db_port: 5432
          db_name: postgres
          db_user: supabase_admin
          db_password: $POSTGRES_PASSWORD
          service_role_key: $SUPABASE_SERVICE_KEY
          hide_client_headers: false

  - name: storage-v1
    _comment: 'Authenticated storage: 20/user/min + 500/user/hr prevents abuse, 50/IP/min fallback'
    url: http://storage:5000/
    routes:
      - name: storage-v1-all
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: cors
      - name: rate-limit-db
        config:
          checks:
            # Check 1: User-based (JWT sub claim - if present)
            # - Max 20 operations per user per minute (uploads, deletes, metadata)
            # - Max 500 operations per user per hour (prevents storage abuse)
            - type: user
              limits:
                minute: 20
                hour: 500
            # Check 2: IP-based fallback (if no JWT or extraction fails)
            # - Max 50 operations per IP per minute
            - type: ip
              limits:
                minute: 50
          db_host: db
          db_port: 5432
          db_name: postgres
          db_user: supabase_admin
          db_password: $POSTGRES_PASSWORD
          service_role_key: $SUPABASE_SERVICE_KEY
          hide_client_headers: false


  #########################################
  ## Analytics Routes
  ##
  ## PURPOSE: Logflare analytics and logging endpoints.
  ##
  ## SECURITY: IP-based only (analytics endpoints vary in auth requirements)
  ##
  ## RATIONALE: Moderate limits (60/min, 1000/hr) to prevent
  ## log spam while allowing legitimate analytics collection.
  #########################################

  - name: analytics-v1
    _comment: 'Analytics: 60/IP/min + 1000/IP/hr prevents log spam while allowing telemetry'
    url: http://analytics:4000/
    routes:
      - name: analytics-v1-all
        strip_path: true
        paths:
          - /analytics/v1/
    plugins:
      - name: rate-limit-db
        config:
          checks:
            # IP-based only (analytics endpoints vary in auth)
            # - Max 60 requests per IP per minute
            # - Max 1000 requests per IP per hour
            - type: ip
              limits:
                minute: 60
                hour: 1000
          db_host: db
          db_port: 5432
          db_name: postgres
          db_user: supabase_admin
          db_password: $POSTGRES_PASSWORD
          service_role_key: $SUPABASE_SERVICE_KEY
          hide_client_headers: false

  #########################################
  ## Database Meta Routes
  ##
  ## PURPOSE: pg-meta (database introspection for Supabase Studio).
  ##
  ## SECURITY: Admin-only (ACL enforced) - no rate limiting needed.
  ##
  ## RATIONALE: Used by internal Studio dashboard only.
  ## ACL restricts to admin role (service_role_key).
  #########################################

  - name: meta
    _comment: 'pg-meta: /pg/* -> http://pg-meta:8080/*'
    url: http://meta:8080/
    routes:
      - name: meta-all
        strip_path: true
        paths:
          - /pg/
    plugins:
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin

  #########################################
  ## Dashboard (Catch-all)
  ##
  ## PURPOSE: Supabase Studio web interface.
  ##
  ## SECURITY: Basic auth enforced (DASHBOARD_USERNAME/PASSWORD) - no rate limiting needed.
  ##
  ## RATIONALE: Internal development tool, basic auth provides sufficient protection.
  #########################################

  - name: dashboard
    _comment: 'Supabase Studio: Internal dashboard protected by basic auth'
    url: http://studio:3000/
    routes:
      - name: dashboard-all
        strip_path: true
        paths:
          - /
    plugins:
      - name: cors
      - name: basic-auth
        config:
          hide_credentials: true

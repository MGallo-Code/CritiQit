_format_version: '3.0'
_transform: true

###
### Global Plugins (DISABLED - using per-route plugins instead)
###
# Commented out - now using per-route rate limiting configuration
# plugins:
#   - name: rate-limit-db
#     enabled: false

###
### Consumers / Users
###
consumers:
  - username: DASHBOARD
  - username: anon
    keyauth_credentials:
      - key: $SUPABASE_ANON_KEY
  - username: service_role
    keyauth_credentials:
      - key: $SUPABASE_SERVICE_KEY

###
### Access Control List
###
acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin

###
### Dashboard credentials
###
basicauth_credentials:
  - consumer: DASHBOARD
    username: $DASHBOARD_USERNAME
    password: $DASHBOARD_PASSWORD

###
### API Routes with Composite Rate Limiting (Phase 2)
###
services:
  #########################################
  ## Tier 2: Content-Based Auth Routes
  ## (Migrated to composite configuration)
  #########################################

  - name: auth-v1-signup
    _comment: 'Composite rate limiting for signup (email + IP)'
    url: http://auth:9999/signup
    routes:
      - name: auth-v1-signup
        strip_path: true
        paths:
          - /auth/v1/signup
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon
      - name: rate-limit-db
        config:
          checks:
            - type: content
              fields: ["email"]
              limits:
                hour: 10
                day: 20
            - type: ip
              limits:
                hour: 50
                day: 500
          db_host: db
          db_port: 5432
          db_name: postgres
          db_user: supabase_admin
          db_password: $POSTGRES_PASSWORD
          service_role_key: $SUPABASE_SERVICE_KEY
          hide_client_headers: false

  - name: auth-v1-token
    _comment: 'Composite rate limiting for login (email + IP)'
    url: http://auth:9999/token
    routes:
      - name: auth-v1-token
        strip_path: true
        paths:
          - /auth/v1/token
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon
      - name: rate-limit-db
        config:
          checks:
            - type: content
              fields: ["email"]
              limits:
                hour: 10
                day: 100
            - type: ip
              limits:
                hour: 50
                day: 500
          db_host: db
          db_port: 5432
          db_name: postgres
          db_user: supabase_admin
          db_password: $POSTGRES_PASSWORD
          service_role_key: $SUPABASE_SERVICE_KEY
          hide_client_headers: false

  - name: auth-v1-recover
    _comment: 'Composite rate limiting for password reset (email + IP)'
    url: http://auth:9999/recover
    routes:
      - name: auth-v1-recover
        strip_path: true
        paths:
          - /auth/v1/recover
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon
      - name: rate-limit-db
        config:
          checks:
            - type: content
              fields: ["email"]
              limits:
                hour: 3
                day: 30
            - type: ip
              limits:
                hour: 30
                day: 300
          db_host: db
          db_port: 5432
          db_name: postgres
          db_user: supabase_admin
          db_password: $POSTGRES_PASSWORD
          service_role_key: $SUPABASE_SERVICE_KEY
          hide_client_headers: false

  - name: auth-v1-resend
    _comment: 'Composite rate limiting for resend verification (email + IP)'
    url: http://auth:9999/resend
    routes:
      - name: auth-v1-resend
        strip_path: true
        paths:
          - /auth/v1/resend
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon
      - name: rate-limit-db
        config:
          checks:
            - type: content
              fields: ["email"]
              limits:
                hour: 3
                day: 30
            - type: ip
              limits:
                hour: 30
                day: 300
          db_host: db
          db_port: 5432
          db_name: postgres
          db_user: supabase_admin
          db_password: $POSTGRES_PASSWORD
          service_role_key: $SUPABASE_SERVICE_KEY
          hide_client_headers: false

  #########################################
  ## Tier 1: IP-Based Auth Routes (OAuth)
  ## (Migrated to composite configuration)
  #########################################

  - name: auth-v1-callback
    _comment: 'IP-based rate limiting for OAuth callback'
    url: http://auth:9999/callback
    routes:
      - name: auth-v1-callback
        strip_path: true
        paths:
          - /auth/v1/callback
    plugins:
      - name: cors
      - name: rate-limit-db
        config:
          checks:
            - type: ip
              limits:
                minute: 100
                hour: 1000
          db_host: db
          db_port: 5432
          db_name: postgres
          db_user: supabase_admin
          db_password: $POSTGRES_PASSWORD
          service_role_key: $SUPABASE_SERVICE_KEY
          hide_client_headers: false

  - name: auth-v1-authorize
    _comment: 'IP-based rate limiting for OAuth authorize'
    url: http://auth:9999/authorize
    routes:
      - name: auth-v1-authorize
        strip_path: true
        paths:
          - /auth/v1/authorize
    plugins:
      - name: cors
      - name: rate-limit-db
        config:
          checks:
            - type: ip
              limits:
                minute: 100
                hour: 1000
          db_host: db
          db_port: 5432
          db_name: postgres
          db_user: supabase_admin
          db_password: $POSTGRES_PASSWORD
          service_role_key: $SUPABASE_SERVICE_KEY
          hide_client_headers: false

  #########################################
  ## Tier 3: User-Based Auth Routes
  ## (Migrated to composite configuration)
  #########################################

  - name: auth-v1-verify
    _comment: 'User-based rate limiting for email verification'
    url: http://auth:9999/verify
    routes:
      - name: auth-v1-verify
        strip_path: true
        paths:
          - /auth/v1/verify
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          deny:
            - anon
      - name: rate-limit-db
        config:
          checks:
            - type: user
              limits:
                minute: 100
                hour: 1000
          db_host: db
          db_port: 5432
          db_name: postgres
          db_user: supabase_admin
          db_password: $POSTGRES_PASSWORD
          service_role_key: $SUPABASE_SERVICE_KEY
          hide_client_headers: false

  - name: auth-v1-user
    _comment: 'User-based rate limiting for user operations'
    url: http://auth:9999/user
    routes:
      - name: auth-v1-user
        strip_path: true
        paths:
          - /auth/v1/user
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon
      - name: rate-limit-db
        config:
          checks:
            - type: user
              limits:
                minute: 100
                hour: 1000
          db_host: db
          db_port: 5432
          db_name: postgres
          db_user: supabase_admin
          db_password: $POSTGRES_PASSWORD
          service_role_key: $SUPABASE_SERVICE_KEY
          hide_client_headers: false

  - name: auth-v1-logout
    _comment: 'User-based rate limiting for logout'
    url: http://auth:9999/logout
    routes:
      - name: auth-v1-logout
        strip_path: true
        paths:
          - /auth/v1/logout
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon
      - name: rate-limit-db
        config:
          checks:
            - type: user
              limits:
                minute: 10
                hour: 100
          db_host: db
          db_port: 5432
          db_name: postgres
          db_user: supabase_admin
          db_password: $POSTGRES_PASSWORD
          service_role_key: $SUPABASE_SERVICE_KEY
          hide_client_headers: false

  #########################################
  ## Auth Catch-All (for remaining endpoints)
  ## (Migrated to composite configuration with user + IP fallback)
  #########################################

  - name: auth-v1-remaining
    _comment: 'Catch-all for other auth endpoints with user + IP fallback'
    url: http://auth:9999/
    routes:
      - name: auth-v1-remaining
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon
      - name: rate-limit-db
        config:
          checks:
            - type: user
              limits:
                minute: 60
                hour: 1000
            - type: ip
              limits:
                minute: 100
          db_host: db
          db_port: 5432
          db_name: postgres
          db_user: supabase_admin
          db_password: $POSTGRES_PASSWORD
          service_role_key: $SUPABASE_SERVICE_KEY
          hide_client_headers: false

  #########################################
  ## Edge Functions Routes
  ## (Migrated to composite configuration)
  #########################################

  - name: functions-v1-verify-otp
    _comment: 'Composite rate limiting for OTP verification (email + IP)'
    url: http://functions:9000/verify-otp-securely
    routes:
      - name: functions-v1-verify-otp
        strip_path: true
        paths:
          - /functions/v1/verify-otp-securely
    plugins:
      - name: cors
      - name: rate-limit-db
        config:
          checks:
            - type: content
              fields: ["email"]
              limits:
                hour: 10
                day: 100
            - type: ip
              limits:
                hour: 50
                day: 500
          db_host: db
          db_port: 5432
          db_name: postgres
          db_user: supabase_admin
          db_password: $POSTGRES_PASSWORD
          service_role_key: $SUPABASE_SERVICE_KEY
          hide_client_headers: false

  - name: functions-v1
    _comment: 'Edge Functions: /functions/v1/* -> http://functions:9000/* (catch-all with baseline protection)'
    url: http://functions:9000/
    routes:
      - name: functions-v1-all
        strip_path: true
        paths:
          - /functions/v1/
    plugins:
      - name: cors
      - name: rate-limit-db
        config:
          checks:
            - type: ip
              limits:
                minute: 100
                hour: 1000
                day: 10000
          db_host: db
          db_port: 5432
          db_name: postgres
          db_user: supabase_admin
          db_password: $POSTGRES_PASSWORD
          service_role_key: $SUPABASE_SERVICE_KEY
          hide_client_headers: false

  #########################################
  ## REST API Routes
  ## (Migrated to composite configuration with user + IP fallback)
  #########################################

  - name: rest-v1
    _comment: 'PostgREST: /rest/v1/* -> http://rest:3000/*'
    url: http://rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: true
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon
      - name: rate-limit-db
        config:
          checks:
            - type: user
              limits:
                minute: 100
                hour: 5000
            - type: ip
              limits:
                minute: 100
          db_host: db
          db_port: 5432
          db_name: postgres
          db_user: supabase_admin
          db_password: $POSTGRES_PASSWORD
          service_role_key: $SUPABASE_SERVICE_KEY
          hide_client_headers: false

  #########################################
  ## GraphQL Routes
  #########################################

  - name: graphql-v1
    _comment: 'PostgREST: /graphql/v1/* -> http://rest:3000/rpc/graphql'
    url: http://rest:3000/rpc/graphql
    routes:
      - name: graphql-v1-all
        strip_path: true
        paths:
          - /graphql/v1
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: true
      - name: request-transformer
        config:
          add:
            headers:
              - Content-Profile:graphql_public
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon
      - name: rate-limit-db
        config:
          checks:
            - type: user
              limits:
                minute: 60
                hour: 1000
            - type: ip
              limits:
                minute: 100
                hour: 1000
          db_host: db
          db_port: 5432
          db_name: postgres
          db_user: supabase_admin
          db_password: $POSTGRES_PASSWORD
          service_role_key: $SUPABASE_SERVICE_KEY
          hide_client_headers: false

  #########################################
  ## Storage Routes
  ## (Migrated to composite configuration)
  #########################################

  - name: storage-v1-public
    _comment: 'IP-based rate limiting for public storage downloads'
    url: http://storage:5000/object/public
    routes:
      - name: storage-v1-public
        strip_path: false
        paths:
          - /storage/v1/object/public/
        methods:
          - GET
    plugins:
      - name: cors
      - name: rate-limit-db
        config:
          checks:
            - type: ip
              limits:
                minute: 200
                hour: 5000
          db_host: db
          db_port: 5432
          db_name: postgres
          db_user: supabase_admin
          db_password: $POSTGRES_PASSWORD
          service_role_key: $SUPABASE_SERVICE_KEY
          hide_client_headers: false

  - name: storage-v1
    _comment: 'User-based rate limiting for authenticated storage operations with IP fallback'
    url: http://storage:5000/
    routes:
      - name: storage-v1-all
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: cors
      - name: rate-limit-db
        config:
          checks:
            - type: user
              limits:
                minute: 20
                hour: 500
            - type: ip
              limits:
                minute: 50
          db_host: db
          db_port: 5432
          db_name: postgres
          db_user: supabase_admin
          db_password: $POSTGRES_PASSWORD
          service_role_key: $SUPABASE_SERVICE_KEY
          hide_client_headers: false

  #########################################
  ## Realtime Routes
  ## (Migrated to composite configuration)
  #########################################

  - name: realtime-v1-ws
    _comment: 'Realtime: /realtime/v1/* -> ws://realtime:4000/socket/*'
    url: http://realtime-dev.supabase-realtime:4000/socket
    protocol: ws
    routes:
      - name: realtime-v1-ws
        strip_path: true
        paths:
          - /realtime/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon
      - name: rate-limit-db
        config:
          checks:
            - type: user
              limits:
                minute: 10
                hour: 100
          db_host: db
          db_port: 5432
          db_name: postgres
          db_user: supabase_admin
          db_password: $POSTGRES_PASSWORD
          service_role_key: $SUPABASE_SERVICE_KEY
          hide_client_headers: false

  - name: realtime-v1-rest
    _comment: 'Realtime: /realtime/v1/api/* -> http://realtime:4000/api/*'
    url: http://realtime-dev.supabase-realtime:4000/api
    protocol: http
    routes:
      - name: realtime-v1-rest
        strip_path: true
        paths:
          - /realtime/v1/api
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon
      - name: rate-limit-db
        config:
          checks:
            - type: user
              limits:
                minute: 60
                hour: 1000
          db_host: db
          db_port: 5432
          db_name: postgres
          db_user: supabase_admin
          db_password: $POSTGRES_PASSWORD
          service_role_key: $SUPABASE_SERVICE_KEY
          hide_client_headers: false

  #########################################
  ## Analytics Routes
  #########################################

  - name: analytics-v1
    _comment: 'Analytics: /analytics/v1/* -> http://logflare:4000/*'
    url: http://analytics:4000/
    routes:
      - name: analytics-v1-all
        strip_path: true
        paths:
          - /analytics/v1/
    plugins:
      - name: rate-limit-db
        config:
          checks:
            - type: ip
              limits:
                minute: 60
                hour: 1000
          db_host: db
          db_port: 5432
          db_name: postgres
          db_user: supabase_admin
          db_password: $POSTGRES_PASSWORD
          service_role_key: $SUPABASE_SERVICE_KEY
          hide_client_headers: false

  #########################################
  ## Database Meta Routes
  #########################################

  - name: meta
    _comment: 'pg-meta: /pg/* -> http://pg-meta:8080/*'
    url: http://meta:8080/
    routes:
      - name: meta-all
        strip_path: true
        paths:
          - /pg/
    plugins:
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin

  #########################################
  ## Dashboard (Catch-all)
  #########################################

  - name: dashboard
    _comment: 'Studio: /* -> http://studio:3000/*'
    url: http://studio:3000/
    routes:
      - name: dashboard-all
        strip_path: true
        paths:
          - /
    plugins:
      - name: cors
      - name: basic-auth
        config:
          hide_credentials: true
